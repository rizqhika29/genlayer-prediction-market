networks:
  default: studionet

  # Accounts are generated by the SDK, so this file needs no key and anyone who
  # clones the repository can run the suite. To run with a real wallet, CI copies
  # gltest.wallet.config.yaml over this file (see the README, "CI").
  studionet:
    url: "https://studio.genlayer.com/api"
    leader_only: false

paths:
  contracts: "contracts"
  artifacts: "artifacts"
