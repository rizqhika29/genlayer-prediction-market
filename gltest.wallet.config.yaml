# Template for running the tests and the deployment with a real wallet.
#
# CI copies this file over gltest.config.yaml only when the
# ACCOUNT_PRIVATE_KEY_1 secret exists, and builds .env with scripts/write_env.py.
# Never put a key in this file: the values are read from .env.
networks:
  default: studionet_wallet

  studionet:
    url: "https://studio.genlayer.com/api"
    leader_only: false

  studionet_wallet:
    id: 61999
    url: "https://studio.genlayer.com/api"
    chain_type: "studionet"
    accounts:
      - "${ACCOUNT_PRIVATE_KEY_1}"
      - "${ACCOUNT_PRIVATE_KEY_2}"
      - "${ACCOUNT_PRIVATE_KEY_3}"
    from: "${ACCOUNT_PRIVATE_KEY_1}"

paths:
  contracts: "contracts"
  artifacts: "artifacts"
